# Builds a rolling "latest" GitHub Release on every push to the default
# branch. The packaged system.json is the repo file with a single field
# changed: version, whose patch segment continues from the previously
# released artifact. The repo file is not committed back.
#
# This complements release.yml (which packages a specific v* tag). This
# workflow instead gives players a stable "Install System" URL that always
# points at the newest build off the default branch:
#   https://github.com/<repo>/releases/latest/download/system.json

name: Build Rolling Latest Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Build Compendium Packs
        run: npm run build:packs

      # A manifest/download URL pointing at some other repo means Foundry
      # checks for updates against a repo this workflow never publishes to,
      # so installs silently stay on an old build. Fail loudly instead.
      - name: Verify Manifest URLs Point At This Repo
        run: |
          expected="https://github.com/${{ github.repository }}/releases/latest/download"
          for field in manifest download; do
            url=$(jq -r ".$field" system.json)
            case "$url" in
              "$expected"/*) ;;
              *) echo "system.json .$field is '$url', expected '$expected/...'"; exit 1 ;;
            esac
          done

      # The previously published "latest" artifact is the only source for the
      # version number: its patch segment is incremented by one. Everything
      # else in the packaged manifest comes from the repo system.json.
      # If the repo bumps major.minor, that wins and patch restarts at 0.
      - name: Compute Next Version
        id: bump_version
        run: |
          repo_version=$(jq -r '.version' system.json)
          IFS='.' read -r repo_major repo_minor _ <<< "$repo_version"

          released_version=$(curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/latest/download/system.json" \
            | jq -r '.version // empty' || true)

          if [ -n "$released_version" ]; then
            IFS='.' read -r old_major old_minor old_patch <<< "$released_version"
          fi

          if [ "${old_major:-}" = "$repo_major" ] && [ "${old_minor:-}" = "$repo_minor" ]; then
            next="${repo_major}.${repo_minor}.$((10#${old_patch:-0} + 1))"
          else
            next="${repo_major}.${repo_minor}.0"
          fi

          echo "Released version: ${released_version:-none}; repo: ${repo_version}; next: ${next}"
          echo "released=${released_version}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      # Stamp version onto the working-tree system.json *before* zip so both
      # the standalone artifact and the copy inside carl-rpg.zip match.
      # Manifest/download and all other fields stay as committed.
      - name: Update system.json and Create System Archive
        # The zip list is a whitelist, same as release.yml: yml_source/, src/,
        # tools/, lib/ and module/quench/ stay out.
        run: |
          jq --arg version "${{ steps.bump_version.outputs.next }}" \
             '.version = $version' \
             system.json > system.json.tmp
          mv system.json.tmp system.json

          zip -r carl-rpg.zip \
            system.json \
            README.md \
            CHANGELOG.md \
            LICENSE.txt \
            assets \
            lang \
            css/carl-rpg.css \
            templates \
            packs \
            module \
            -x "module/quench/*"

          unzip -p ./carl-rpg.zip system.json | jq -e --arg version "${{ steps.bump_version.outputs.next }}" \
            '.version == $version'

      - name: Update Rolling "latest" Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          tag: latest
          commit: ${{ github.sha }}
          name: "Latest (${{ steps.bump_version.outputs.next }})"
          body: "Automated rolling build from ${{ github.repository }}@${{ github.sha }}."
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./system.json, ./carl-rpg.zip"
